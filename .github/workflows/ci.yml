name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build applications
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  containers:
    name: Build ${{ matrix.application }} container
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        application:
          - api
          - web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container
        run: docker build --file apps/${{ matrix.application }}/Dockerfile .
